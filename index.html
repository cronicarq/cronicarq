<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Crónica Arquitectura — Prácticas sobre tiempo, memoria y espacio.">
  <title>Crónica Arquitectura</title>

  <style>
    :root {
      --background: #ffffff;
      --ink: #181818;
      --muted: #525252;
      --line: rgba(24,24,24,.15);
      --page-gap: clamp(18px, 2.5vw, 38px);
    }

    * { box-sizing: border-box; }

    html {
      background: var(--background);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--background);
      color: var(--ink);
      font-family: Univers, "Univers Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .cover {
      min-height: 64vh;
      display: flex;
      align-items: flex-start;
      padding: 10vh clamp(90px, 10vw, 180px) 24px;
    }

    .cover-inner {
      width: min(1000px, 100%);
      transform: translateX(5vw);
    }

    .cover h1 {
      margin: 0;
      font-size: clamp(66px, 7.2vw, 118px);
      line-height: .92;
      letter-spacing: -.045em;
      font-weight: 700;
    }

    .cover p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 1.6vw, 28px);
      line-height: 1.12;
      white-space: nowrap;
    }

    .viewer-shell {
      width: 100%;
      padding: 34px 0 64px;
    }

    #viewer {
      width: min(1380px, calc(100% - 48px));
      margin: 0 auto;
      display: grid;
      gap: var(--page-gap);
      justify-items: center;
    }

    .pdf-page {
      position: relative;
      width: 100%;
      background: #fff;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
      content-visibility: auto;
      contain-intrinsic-size: auto 900px;
    }

    .pdf-page canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .loading,
    .error {
      min-height: 45vh;
      display: grid;
      place-items: center;
      padding: 40px;
      color: var(--muted);
      text-align: center;
    }

    .error a {
      color: inherit;
    }

    .zoom-controls {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px));
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 8px 28px rgba(0,0,0,.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .zoom-controls button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 22px;
      cursor: pointer;
    }

    .zoom-controls button:active {
      background: rgba(0,0,0,.07);
    }

    .zoom-level {
      min-width: 54px;
      text-align: center;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    footer {
      padding: 24px 32px;
      border-top: 1px solid var(--line);
      color: #777;
      font-size: 11px;
      line-height: 1.45;
    }

    @media (max-width: 700px) {
      :root { --page-gap: 8px; }

      .cover {
        min-height: 54svh;
        padding:
          max(58px, calc(env(safe-area-inset-top) + 18px))
          30px
          18px;
      }

      .cover-inner {
        width: 100%;
        transform: none;
      }

      .cover h1 {
        font-size: clamp(54px, 14vw, 78px);
        line-height: .94;
      }

      .cover p {
        margin-top: 6px;
        font-size: clamp(13px, 3.8vw, 20px);
        letter-spacing: -.01em;
      }

      .viewer-shell {
        padding: 8px 0 24px;
      }

      #viewer {
        width: 100%;
      }

      .pdf-page {
        box-shadow: none;
        contain-intrinsic-size: auto 560px;
      }

      .zoom-controls {
        right: 12px;
      }

      .zoom-controls button {
        width: 38px;
        height: 38px;
      }

      footer {
        padding: 18px 16px 84px;
        font-size: 10px;
      }
    }

    @media (max-width: 360px) {
      .cover p {
        font-size: 12.5px;
        letter-spacing: -.025em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

  <section class="cover" aria-labelledby="titulo-principal">
    <div class="cover-inner">
      <h1 id="titulo-principal">Crónica<br>Arquitectura</h1>
      <p>Prácticas sobre tiempo, memoria y espacio</p>
    </div>
  </section>

  <main class="viewer-shell">
    <div id="viewer" aria-label="Portafolio Crónica Arquitectura">
      <div class="loading" id="status">Preparando el portafolio…</div>
    </div>
  </main>

  <nav class="zoom-controls" aria-label="Controles de zoom">
    <button type="button" id="zoomOut" aria-label="Alejar">−</button>
    <span class="zoom-level" id="zoomLevel">100%</span>
    <button type="button" id="zoomIn" aria-label="Acercar">+</button>
    <button type="button" id="zoomReset" aria-label="Restablecer zoom">↺</button>
  </nav>

  <footer>
    © 2026 Arturo Mata. Todos los derechos reservados. Las fotografías y textos
    contenidos en este portafolio no podrán reproducirse sin autorización expresa del autor.
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    (() => {
      const PDF_URL = "cronica-arquitectura.pdf";
      const viewer = document.getElementById("viewer");
      const status = document.getElementById("status");
      const zoomLevel = document.getElementById("zoomLevel");
      const zoomIn = document.getElementById("zoomIn");
      const zoomOut = document.getElementById("zoomOut");
      const zoomReset = document.getElementById("zoomReset");

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      let pdfDocument = null;
      let zoom = 1;
      let renderToken = 0;
      let resizeTimer = null;

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      function updateZoomLabel() {
        zoomLevel.textContent = Math.round(zoom * 100) + "%";
      }

      function getViewerBaseWidth() {
        return viewer.clientWidth;
      }

      async function renderPage(pageNumber, token) {
        const page = await pdfDocument.getPage(pageNumber);
        if (token !== renderToken) return;

        const baseViewport = page.getViewport({ scale: 1 });
        const targetCssWidth = getViewerBaseWidth() * zoom;
        const cssScale = targetCssWidth / baseViewport.width;
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        const renderViewport = page.getViewport({ scale: cssScale * dpr });

        const wrapper = document.createElement("article");
        wrapper.className = "pdf-page";
        wrapper.setAttribute("aria-label", `Página ${pageNumber}`);

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d", { alpha: false });

        canvas.width = Math.floor(renderViewport.width);
        canvas.height = Math.floor(renderViewport.height);
        canvas.style.width = Math.floor(renderViewport.width / dpr) + "px";
        canvas.style.height = Math.floor(renderViewport.height / dpr) + "px";

        wrapper.style.width = canvas.style.width;
        wrapper.appendChild(canvas);
        viewer.appendChild(wrapper);

        await page.render({
          canvasContext: context,
          viewport: renderViewport,
          intent: "display"
        }).promise;
      }

      async function renderDocument() {
        if (!pdfDocument) return;

        const token = ++renderToken;
        viewer.innerHTML = "";
        updateZoomLabel();

        for (let pageNumber = 1; pageNumber <= pdfDocument.numPages; pageNumber++) {
          if (token !== renderToken) return;
          await renderPage(pageNumber, token);
        }
      }

      async function loadPdf() {
        try {
          pdfDocument = await pdfjsLib.getDocument(PDF_URL).promise;
          status.remove();
          await renderDocument();
        } catch (error) {
          console.error(error);
          viewer.innerHTML = `
            <div class="error">
              <p>No fue posible cargar el portafolio.<br>
              <a href="${PDF_URL}">Abrir el PDF directamente</a></p>
            </div>`;
        }
      }

      zoomIn.addEventListener("click", () => {
        zoom = clamp(zoom + 0.25, 0.75, 3);
        renderDocument();
      });

      zoomOut.addEventListener("click", () => {
        zoom = clamp(zoom - 0.25, 0.75, 3);
        renderDocument();
      });

      zoomReset.addEventListener("click", () => {
        zoom = 1;
        renderDocument();
      });

      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(renderDocument, 180);
      });

      loadPdf();
    })();
  </script>
</body>
</html>
