<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Crónica Arquitectura — Prácticas sobre tiempo, memoria y espacio.">
  <title>Crónica Arquitectura</title>

  <style>
    :root {
      --background: #ffffff;
      --ink: #181818;
      --muted: #4e4e4e;
      --line: rgba(24,24,24,.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--background);
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font-family: Univers, "Univers Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .cover {
      min-height: 64vh;
      display: flex;
      align-items: flex-start;
      padding: 8vh 48px 24px;
      background: var(--background);
    }

    .cover-inner {
      width: min(900px, 100%);
      transform:none;
      margin-left:0;
    }

    .cover h1 {
      margin: 0;
      font-size: clamp(52px, 5vw, 84px);
      line-height: .92;
      letter-spacing: -.045em;
      font-weight: 700;
    }

    .cover p {
      margin: 8px 0 0;
      font-size: clamp(14px, 1.1vw, 18px);
      line-height: 1.12;
      color: var(--muted);
      white-space: nowrap;
    }

    .pages {
      width: min(1380px, calc(100% - 48px));
      margin: 0 auto;
      padding: 34px 0 64px;
      display: grid;
      gap: clamp(18px, 2.5vw, 38px);
    }

    .page {
      margin: 0;
      display: grid;
      place-items: center;
      content-visibility: auto;
      contain-intrinsic-size: auto 900px;
    }

    .page img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
    }

    footer {
      padding: 24px 32px;
      border-top: 1px solid var(--line);
      color: #777;
      font-size: 11px;
      line-height: 1.45;
    }

    @media (max-width: 700px) {
      .cover {
        min-height: 54svh;
        padding:
          max(42px, calc(env(safe-area-inset-top) + 8px))
          18px
          18px;
      }

      .cover-inner {
        width: 100%;
        transform: none;
      }

      .cover h1 {
        font-size: clamp(42px, 11vw, 58px);
        line-height: .94;
      }

      .cover p {
        margin-top: 6px;
        font-size: clamp(11px, 3vw, 15px);
        line-height: 1.1;
        letter-spacing: -.01em;
      }

      .pages {
        width: 100%;
        padding: 8px 0 24px;
        gap: 8px;
      }

      .page {
        display: block;
        contain-intrinsic-size: auto 560px;
      }

      .page img {
        width: 100%;
        box-shadow: none;
      }

      footer {
        padding: 18px 16px;
        font-size: 10px;
      }
    }

    @media (max-width: 360px) {
      .cover p {
        font-size: 12.5px;
        letter-spacing: -.025em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
<body>
