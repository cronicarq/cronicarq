<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Crónica Arquitectura — Prácticas sobre tiempo, memoria y espacio.">
  <title>Crónica Arquitectura</title>

  <style>
    :root {
      --background: #ffffff;
      --ink: #181818;
      --muted: #525252;
      --line: rgba(24,24,24,.15);
      --page-gap: clamp(18px, 2.5vw, 38px);
    }

    * { box-sizing: border-box; }

    html {
      background: var(--background);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      touch-action: auto;
      background: var(--background);
      color: var(--ink);
      font-family: Univers, "Univers Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .cover {
      min-height: 52svh;
      display: flex;
      align-items: flex-start;
      padding:
        max(34px, calc(env(safe-area-inset-top) + 10px))
        38px
        12px;
      background: var(--background);
    }

    .cover-inner {
      width: 100%;
      margin: 0;
      transform: none;
    }

    .cover h1 {
      margin: 0;
      font-size: clamp(56px, 14vw, 82px);
      line-height: .90;
      letter-spacing: -.05em;
      font-weight: 700;
    }

    .cover p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: clamp(14px, 3.8vw, 20px);
      line-height: 1.05;
      letter-spacing: -.01em;
      white-space: nowrap;
    }

    .viewer-shell {
      width: 100%;
      padding: 0 0 24px;
    }

    #viewer {
      width: 100%;
      margin: 0;
      display: grid;
      gap: 8px;
      justify-items: center;
    }

    .pdf-page {
      position: relative;
      width: 100%;
      background: #fff;
      box-shadow: none;
      content-visibility: auto;
      contain-intrinsic-size: auto 560px;
    }

    .pdf-page canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      max-width: 100%;
    }

    .loading,
    .error {
      min-height: 45vh;
      display: grid;
      place-items: center;
      padding: 40px;
      color: var(--muted);
      text-align: center;
    }

    .error a {
      color: inherit;
    }
footer {
      padding: 18px 16px 24px;
      border-top: 1px solid var(--line);
      color: #777;
      font-size: 10px;
      line-height: 1.45;
    }


    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

  <section class="cover" aria-labelledby="titulo-principal">
    <div class="cover-inner">
      <h1 id="titulo-principal">Crónica<br>Arquitectura</h1>
      <p>Prácticas sobre tiempo, memoria y espacio</p>
    </div>
  </section>

  <main class="viewer-shell">
    <div id="viewer" aria-label="Portafolio Crónica Arquitectura">
      <div class="loading" id="status">Preparando el portafolio…</div>
    </div>
  </main>
<footer>
    © 2026 Arturo Mata. Todos los derechos reservados. Las fotografías y textos
    contenidos en este portafolio no podrán reproducirse sin autorización expresa del autor.
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    (() => {
      const PDF_URL = "cronica-arquitectura.pdf";
      const viewer = document.getElementById("viewer");
      const status = document.getElementById("status");

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      let pdfDocument = null;
      const zoom = 1;
      let renderToken = 0;
      let resizeTimer = null;

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      function getViewerBaseWidth() {
        return viewer.clientWidth;
      }

      async function renderPage(pageNumber, token) {
        const page = await pdfDocument.getPage(pageNumber);
        if (token !== renderToken) return;

        const baseViewport = page.getViewport({ scale: 1 });
        const targetCssWidth = getViewerBaseWidth() * zoom;
        const cssScale = targetCssWidth / baseViewport.width;
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        const renderViewport = page.getViewport({ scale: cssScale * dpr });

        const wrapper = document.createElement("article");
        wrapper.className = "pdf-page";
        wrapper.setAttribute("aria-label", `Página ${pageNumber}`);

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d", { alpha: false });

        canvas.width = Math.floor(renderViewport.width);
        canvas.height = Math.floor(renderViewport.height);
        canvas.style.width = Math.floor(renderViewport.width / dpr) + "px";
        canvas.style.height = Math.floor(renderViewport.height / dpr) + "px";

        wrapper.style.width = canvas.style.width;
        wrapper.appendChild(canvas);
        viewer.appendChild(wrapper);

        await page.render({
          canvasContext: context,
          viewport: renderViewport,
          intent: "display"
        }).promise;
      }

      async function renderDocument() {
        if (!pdfDocument) return;

        const token = ++renderToken;
        viewer.innerHTML = "";

        for (let pageNumber = 1; pageNumber <= pdfDocument.numPages; pageNumber++) {
          if (token !== renderToken) return;
          await renderPage(pageNumber, token);
        }
      }

      async function loadPdf() {
        try {
          pdfDocument = await pdfjsLib.getDocument(PDF_URL).promise;
          status.remove();
          await renderDocument();
        } catch (error) {
          console.error(error);
          viewer.innerHTML = `
            <div class="error">
              <p>No fue posible cargar el portafolio.<br>
              <a href="${PDF_URL}">Abrir el PDF directamente</a></p>
            </div>`;
        }
      }

      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(renderDocument, 180);
      });

      loadPdf();
    })();
  </script>

  <script>
    (() => {
      const meta = document.getElementById("viewport-meta");
      const locked = "width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover";
      const zoomable = "width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover";

      function resetInitialScale() {
        meta.setAttribute("content", locked);
        window.scrollTo(0, 0);

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            meta.setAttribute("content", zoomable);
          });
        });
      }

      window.addEventListener("pageshow", resetInitialScale);
      window.addEventListener("load", resetInitialScale);
    })();
  </script>

</body>
</html>
